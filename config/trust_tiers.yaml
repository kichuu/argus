tiers:
  - tier: 1
    label: primary
    description: Official records, peer-reviewed journals, primary documents, government statistical agencies.
    weight: 1.0
    examples:
      - reuters.com
      - apnews.com
      - sec.gov
      - congress.gov
      - bls.gov
      - noaa.gov
      - ipcc.ch
      - who.int
      - ec.europa.eu
      - federalreserve.gov
      - imf.org
      - worldbank.org
      - un.org
      - eia.gov
      - cdc.gov
  - tier: 2
    label: established
    description: Major news wires and established outlets with strong editorial standards.
    weight: 0.8
    examples:
      - ft.com
      - wsj.com
      - nytimes.com
      - bbc.com
      - bloomberg.com
      - theguardian.com
      - economist.com
      - washingtonpost.com
      - npr.org
      - nature.com
      - science.org
  - tier: 3
    label: secondary
    description: Specialist outlets, regional newsrooms, and vetted analysis sites.
    weight: 0.5
    examples:
      - politico.com
      - axios.com
      - propublica.org
      - arstechnica.com
      - thehill.com
      - foreignpolicy.com
      - lawfaremedia.org
      - carbonbrief.org
      - inside-climatenews.org
  - tier: 4
    label: unvetted
    description: User-generated, unknown provenance, or low editorial control.
    weight: 0.2
    examples:
      - medium.com
      - substack.com
      - reddit.com
      - twitter.com
      - x.com
      - facebook.com

