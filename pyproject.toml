[project]
name = "argus"
version = "0.1.0"
description = "Argus: world-awareness claim-ledger platform"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "apps/workers", "packages/*"]

[tool.uv.sources]
argus-core = { workspace = true }
argus-ingestion = { workspace = true }
argus-extraction = { workspace = true }
argus-retrieval = { workspace = true }
argus-agents = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.7",
    "pyright>=1.1",
    "alembic>=1.14",
    "ipython>=8.30",
    "httpx>=0.28",
    "respx>=0.21",
    "psycopg[binary]>=3.2",
    "qdrant-client>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "RUF", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011", "N802"]
# Scripts unpack imported classes from helpers; PascalCase names are correct.
"scripts/**" = ["N806"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["apps", "packages"]
exclude = ["**/__pycache__", "**/.venv", "**/node_modules", "alembic/versions"]
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps", "packages"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --import-mode=importlib"
