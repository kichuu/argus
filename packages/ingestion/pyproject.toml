[project]
name = "argus-ingestion"
version = "0.1.0"
description = "Argus ingestion: source connectors, dedup, raw store"
requires-python = ">=3.12"
dependencies = [
    "argus-core",
    "feedparser>=6.0",
    "httpx>=0.28",
    "python-dateutil>=2.9",
    "simhash>=2.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "aioboto3>=15.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_ingestion"]
