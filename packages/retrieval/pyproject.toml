[project]
name = "argus-retrieval"
version = "0.1.0"
description = "Argus retrieval: hybrid Qdrant + Apache AGE graph retrieval with reranking"
requires-python = ">=3.12"
dependencies = [
    "argus-core",
    "qdrant-client>=1.13",
    "sentence-transformers>=3.3",
    "cohere>=5.13",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_retrieval"]
