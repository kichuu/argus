[project]
name = "argus-extraction"
version = "0.1.0"
description = "Argus extraction: LLM extraction + programmatic + adversarial verification"
requires-python = ">=3.12"
dependencies = [
    "argus-core",
    "openai>=1.55",
    "pydantic>=2.9",
    "httpx>=0.28",
    "gliner>=0.2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_extraction"]
